name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Build APK Directly
      run: |
        set -e
        mkdir -p app/src/main/java/com/rama77/app/adapter app/src/main/res/layout app/src/main/res/drawable
        
        echo 'include(":app")' > settings.gradle.kts
        echo 'plugins { id("com.android.application") version "8.4.1" apply false; id("org.jetbrains.kotlin.android") version "1.9.24" apply false }' > build.gradle.kts

        echo 'package com.rama77.app.adapter
        import android.view.LayoutInflater
        import android.view.ViewGroup
        import androidx.recyclerview.widget.RecyclerView
        import com.rama77.app.databinding.ItemFundsMenuBinding
        class SeriesTabAdapter(private val items: List<String>, private val onItemClick: (String) -> Unit) : RecyclerView.Adapter<SeriesTabAdapter.ViewHolder>() {
            class ViewHolder(val binding: ItemFundsMenuBinding) : RecyclerView.ViewHolder(binding.root)
            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) = ViewHolder(ItemFundsMenuBinding.inflate(LayoutInflater.from(parent.context), parent, false))
            override fun onBindViewHolder(holder: ViewHolder, position: Int) { holder.binding.tvFundsTitle.text = items[position]; holder.itemView.setOnClickListener { onItemClick(items[position]) } }
            override fun getItemCount() = items.size
        }' > app/src/main/java/com/rama77/app/adapter/SeriesTabAdapter.kt

        echo '<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp"><TextView android:id="@+id/tvFundsTitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textSize="16sp" /></LinearLayout>' > app/src/main/res/layout/item_funds_menu.xml

        for icon in ic_card_single ic_card_double ic_card_triple ic_dice_2 ic_gauge ic_brackets ic_users ic_layout_grid ic_boxes ic_dice_all ic_dice_1 ic_wallet_funds ic_support_headset ic_home ic_line_chart ic_help_circle ic_message_square ic_rupee_coin ic_file_text ic_settings ic_globe ic_moon ic_share ic_log_out ic_trash ic_target ic_info_circle_orange ic_play_arrow ic_user ic_clock_history ic_book_passbook ic_call_orange ic_lock_key ic_starline_small ic_whatsapp_green ic_bell ic_arrow_back ic_fingerprint_line ic_menu ic_wallet ic_headset_support ic_chevron_right; do
            echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF7A00" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/></vector>' > app/src/main/res/drawable/${icon}.xml
        done

        gradle wrapper --gradle-version 8.6
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
