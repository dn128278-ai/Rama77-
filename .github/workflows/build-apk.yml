name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Directory Structure
      run: |
        # Create directories for app module and version catalog
        mkdir -p app/src/main/java/com/rama77/app app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable gradle
        
        # Move version catalog file
        [ -f libs.versions.toml ] && mv libs.versions.toml gradle/
        
        # Move Kotlin source files
        for f in *.kt; do
          [ -f "$f" ] && mv "$f" app/src/main/java/com/rama77/app/
        done
        
        # Move XML layout files
        for f in activity_*.xml fragment_*.xml item_*.xml nav_*.xml bottom_*.xml drawer_*.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/layout/
        done
        
        # Move other XML resources
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
        [ -f bg_orange_circle_badge.xml ] && mv bg_orange_circle_badge.xml app/src/main/res/drawable/
        
        # Setup App Module build script
        [ -f build.gradle.kts ] && mv build.gradle.kts app/
        
        # Create Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: |
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
