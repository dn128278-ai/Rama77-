name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: 1. Fix Project Structure & Build APK
      run: |
        set -e
        
        # Ensure app directory exists
        mkdir -p app/src/main/java/com/rama77/app/adapter \
                 app/src/main/res/layout \
                 app/src/main/res/drawable

        # Force create proper settings.gradle.kts at root
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Rama77"
        include(":app")
        EOF

        # Force create root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.4.1" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
        }
        EOF

        # Create basic app/build.gradle.kts if missing or broken
        if [ ! -f app/build.gradle.kts ]; then
            cat << 'EOF' > app/build.gradle.kts
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
            }
            android {
                namespace = "com.rama77.app"
                compileSdk = 34
                defaultConfig {
                    applicationId = "com.rama77.app"
                    minSdk = 24
                    targetSdk = 34
                    versionCode = 2
                    versionName = "2.0"
                }
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            dependencies {
                implementation("androidx.core:core-ktx:1.13.1")
                implementation("androidx.appcompat:appcompat:1.7.0")
                implementation("com.google.android.material:material:1.12.0")
            }
            EOF
        fi

        # Create missing adapter
        cat << 'EOF' > app/src/main/java/com/rama77/app/adapter/SeriesTabAdapter.kt
        package com.rama77.app.adapter
        import android.view.LayoutInflater
        import android.view.ViewGroup
        import androidx.recyclerview.widget.RecyclerView
        import com.rama77.app.databinding.ItemFundsMenuBinding
        class SeriesTabAdapter(private val items: List<String>, private val onItemClick: (String) -> Unit) :
            RecyclerView.Adapter<SeriesTabAdapter.ViewHolder>() {
            class ViewHolder(val binding: ItemFundsMenuBinding) : RecyclerView.ViewHolder(binding.root)
            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) = ViewHolder(ItemFundsMenuBinding.inflate(LayoutInflater.from(parent.context), parent, false))
            override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                holder.binding.tvFundsTitle.text = items[position]
                holder.itemView.setOnClickListener { onItemClick(items[position]) }
            }
            override fun getItemCount() = items.size
        }
        EOF

        cat << 'EOF' > app/src/main/res/layout/item_funds_menu.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp">
            <TextView android:id="@+id/tvFundsTitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textSize="16sp" />
        </LinearLayout>
        EOF

        gradle wrapper --gradle-version 8.6
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
