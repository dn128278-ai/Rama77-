name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Full Auto Setup & Build APK
      run: |
        set -e
        
        # 1. Clean everything to remove previous conflicting files
        rm -rf app settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties

        # 2. Create clean directory structure
        mkdir -p app/src/main/java/com/rama77/app \
                 app/src/main/res/layout \
                 app/src/main/res/values

        # 3. Create settings.gradle.kts
        printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "Rama77"\ninclude(":app")\n' > settings.gradle.kts

        # 4. Create root build.gradle.kts
        printf 'plugins {\n    id("com.android.application") version "8.4.1" apply false\n    id("org.jetbrains.kotlin.android") version "1.9.24" apply false\n}\n' > build.gradle.kts

        # 5. Create app/build.gradle.kts
        printf 'plugins {\n    id("com.android.application")\n    id("org.jetbrains.kotlin.android")\n}\nandroid {\n    namespace = "com.rama77.app"\n    compileSdk = 34\n    defaultConfig {\n        applicationId = "com.rama77.app"\n        minSdk = 24\n        targetSdk = 34\n        versionCode = 2\n        versionName = "2.0"\n    }\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n    implementation("androidx.appcompat:appcompat:1.7.0")\n    implementation("com.google.android.material:material:1.12.0")\n}\n' > app/build.gradle.kts

        # 6. Create gradle.properties
        printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n' > gradle.properties

        # 7. Create AndroidManifest.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application\n        android:allowBackup="true"\n        android:icon="@android:drawable/ic_menu_compass"\n        android:label="RAMA77"\n        android:supportsRtl="true"\n        android:theme="@style/Theme.AppCompat.Light.NoActionBar">\n        <activity\n            android:name=".MainActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

        # 8. Create basic MainActivity.kt
        printf 'package com.rama77.app\nimport android.os.Bundle\nimport androidx.appcompat.app.AppCompatActivity\nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(android.R.layout.activity_list_item)\n    }\n}\n' > app/src/main/java/com/rama77/app/MainActivity.kt

        # 9. Run Gradle build
        gradle wrapper --gradle-version 8.6
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
