name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Directory Structure & Generate Styles & Drawables
      run: |
        # Create full Android project resource directory tree
        mkdir -p app/src/main/java/com/rama77/app \
                 app/src/main/res/layout \
                 app/src/main/res/values \
                 app/src/main/res/drawable \
                 app/src/main/res/color \
                 app/src/main/res/menu \
                 app/src/main/res/mipmap-anydpi-v26 \
                 app/src/main/res/xml \
                 gradle
        
        # Create gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # Clean strings.xml
        if [ -f strings.xml ]; then
          sed -i "s/Don't/Don\\\'t/g" strings.xml
        fi

        # Remove helperTextColor attribute to avoid missing reference errors
        for f in *.xml; do
          [ -f "$f" ] && sed -i 's/app:helperTextColor="[^"]*"//g' "$f"
        done

        # Overwrite fragment_support.xml with a clean layout
        cat << 'EOF' > fragment_support.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp"
            android:background="#121212">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Support and Help"
                android:textColor="#FFFFFF"
                android:textSize="22sp"
                android:textStyle="bold" />

            <androidx.cardview.widget.CardView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="16dp"
                app:cardBackgroundColor="#1E1E24"
                app:cardCornerRadius="12dp"
                app:cardElevation="4dp">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:padding="16dp">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Contact Customer Support"
                        android:textColor="#FFFFFF"
                        android:textSize="16sp"
                        android:textStyle="bold" />

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="8dp"
                        android:text="Need help with bets or withdrawals? Chat with us."
                        android:textColor="#AAAAAA"
                        android:textSize="14sp" />

                </LinearLayout>
            </androidx.cardview.widget.CardView>
        </LinearLayout>
        EOF

        # Create dummy backup and extraction rules
        cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content></full-backup-content>
        EOF

        cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup />
        </data-extraction-rules>
        EOF

        # Generate styles.xml with MpinBoxStyle directly in res/values
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="MpinBoxStyle" parent="Widget.AppCompat.EditText">
                <item name="android:layout_width">48dp</item>
                <item name="android:layout_height">56dp</item>
                <item name="android:gravity">center</item>
                <item name="android:inputType">numberPassword</item>
                <item name="android:maxLength">1</item>
                <item name="android:textSize">20sp</item>
                <item name="android:textStyle">bold</item>
            </style>
        </resources>
        EOF

        # Generate Color Selector
        cat << 'EOF' > app/src/main/res/color/selector_nav_color.xml
        <?xml version="1.0" encoding="utf-8"?>
        <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_checked="true" android:color="#F16521" />
            <item android:color="#8E8E93" />
        </selector>
        EOF

        # Generate ALL Missing Drawables & Vector Icons directly in res/drawable
        cat << 'EOF' > app/src/main/res/drawable/bg_game_center_scaffold.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#121212"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_orange_gradient_button.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:startColor="#F16521" android:endColor="#D84B06" android:angle="45"/>
            <corners android:radius="12dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_button_orange.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#F16521"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_orange_circle.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#F16521"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_white_rounded_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#FFFFFF"/>
            <corners android:radius="16dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_translucent_circle.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#22FFFFFF"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_translucent_pill.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#22FFFFFF"/>
            <corners android:radius="20dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_session_container.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#1E1E24"/>
            <corners android:radius="14dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_session_tab_active.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#F16521"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_session_tab_inactive.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#2C2C30"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_logo_icon.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#F16521"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_wallet_pill.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#2A2A2E"/>
            <corners android:radius="20dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_fingerprint_line.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zm0,18c-4.41,0 -8,-3.59 -8,-8s3.59,-8 8,-8 8,3.59 8,8 -3.59,8 -8,8z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_menu.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M3,18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_wallet.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M21,18v1c0,1.1 -0.9,2 -2,2H5c-1.11,0 -2,-0.9 -2,-2V5c0,-1.1 0.89,-2 2,-2h14c1.1,0 2,0.9 2,2v1h-9c-1.11,0 -2,0.9 -2,2v8c0,1.1 0.89,2 2,2h9zm-9,-2h10V8H12v8zm4,-2.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_bell.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zm6,-6v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_arrow_back.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#F16521" android:pathData="M0,0h108v108h-108z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_background" />
        </adaptive-icon>
        EOF

        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_background" />
        </adaptive-icon>
        EOF

        # Move files cleanly
        [ -f libs.versions.toml ] && mv libs.versions.toml gradle/
        
        for f in *.kt; do
          [ -f "$f" ] && mv "$f" app/src/main/java/com/rama77/app/
        done
        
        for f in activity_*.xml fragment_*.xml item_*.xml nav_*.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/layout/
        done

        for f in bottom_nav_menu.xml drawer_nav_menu.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/menu/
        done
        
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
        
        [ -f build.gradle.kts ] && mv build.gradle.kts app/
        
        cat << 'EOF' > build.gradle.kts
        plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: |
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
