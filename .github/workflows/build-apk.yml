name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Directory Structure & Generate ALL Resources
      run: |
        # Create directories for app module and resource structure
        mkdir -p app/src/main/java/com/rama77/app app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/color app/src/main/res/menu app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml gradle
        
        # Create gradle.properties to enable AndroidX
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # Fix strings.xml unescaped character
        if [ -f strings.xml ]; then
          sed -i "s/Don't/Don\\\'t/g" strings.xml
        fi

        # Fix missing app namespace in fragment_support.xml
        if [ -f fragment_support.xml ]; then
          sed -i 's/xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android" xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/g' fragment_support.xml
        fi

        # Remove unsupported helperTextColor attribute from layout files
        for f in *.xml; do
          [ -f "$f" ] && sed -i 's/app:helperTextColor="[^"]*"//g' "$f"
        done

        # Clean AndroidManifest.xml from missing references
        if [ -f AndroidManifest.xml ]; then
          sed -i 's/package="[^"]*"//g' AndroidManifest.xml
          sed -i 's/android:dataExtractionRules="[^"]*"//g' AndroidManifest.xml
          sed -i 's/android:fullBackupContent="[^"]*"//g' AndroidManifest.xml
        fi

        # Create dummy backup and data extraction rules
        cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content></full-backup-content>
        EOF

        cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup />
        </data-extraction-rules>
        EOF

        # Generate fallback styles.xml and attrs.xml
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="MpinBoxStyle">
                <item name="android:layout_width">48dp</item>
                <item name="android:layout_height">56dp</item>
                <item name="android:gravity">center</item>
                <item name="android:inputType">numberPassword</item>
                <item name="android:maxLength">1</item>
                <item name="android:textSize">20sp</item>
                <item name="android:textStyle">bold</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/attrs.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <declare-styleable name="CustomAttrs">
                <attr name="helperTextColor" format="color"/>
            </declare-styleable>
        </resources>
        EOF

        # Generate Color Selectors
        cat << 'EOF' > app/src/main/res/color/selector_nav_color.xml
        <?xml version="1.0" encoding="utf-8"?>
        <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_checked="true" android:color="#F16521" />
            <item android:color="#8E8E93" />
        </selector>
        EOF

        # Generate Drawables Fallbacks
        cat << 'EOF' > app/src/main/res/drawable/bg_orange_gradient_button.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:startColor="#F16521" android:endColor="#D84B06" android:angle="45"/>
            <corners android:radius="12dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_button_orange.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#F16521"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_orange_circle.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#F16521"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_white_rounded_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#FFFFFF"/>
            <corners android:radius="16dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_category_tab_selected.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#F16521"/>
            <corners android:radius="20dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_translucent_circle.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#22FFFFFF"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_translucent_pill.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#22FFFFFF"/>
            <corners android:radius="20dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_session_container.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#1E1E24"/>
            <corners android:radius="14dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_session_tab_active.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#F16521"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_session_tab_inactive.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#2C2C30"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_logo_icon.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#F16521"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_wallet_pill.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#2A2A2E"/>
            <corners android:radius="20dp"/>
        </shape>
        EOF

        # Vectors
        cat << 'EOF' > app/src/main/res/drawable/ic_call_orange.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M6.62,10.79c1.44,2.83 3.76,5.14 6.59,6.59l2.2,-2.2c0.27,-0.27 0.67,-0.36 1.02,-0.24 1.12,0.37 2.33,0.57 3.57,0.57 0.55,0 1,0.45 1,1V20c0,0.55 -0.45,1 -1,1 -9.39,0 -17,-7.61 -17,-17 0,-0.55 0.45,-1 1,-1h3.5c0.55,0 1,0.45 1,1 0,1.25 0.2,2.45 0.57,3.57 0.11,0.35 0.03,0.74 -0.24,1.02l-2.2,2.2z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_whatsapp_green.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#25D366" android:pathData="M12,2A10,10 0 0,0 2,12C2,13.8 2.5,15.5 3.4,17L2,22L7.2,20.6C8.6,21.5 10.3,22 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_lock_key.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M18,8h-1V6c0,-2.76 -2.24,-5 -5,-5S7,3.24 7,6v2H6c-1.1,0 -2,0.9 -2,2v10c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V10c0,-1.1 -0.9,-2 -2,-2zm-6,9c-1.1,0 -2,-0.9 -2,-2s0.9,-2 2,-2 2,0.9 2,2 -0.9,2 -2,2zm3.1,-9H8.9V6c0,-1.71 1.39,-3.1 3.1,-3.1 1.71,0 3.1,1.39 3.1,3.1v2z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_starline_small.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="16dp" android:height="16dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M12,17.27L18.18,21l-1.64,-7.03L22,9.24l-7.19,-0.61L12,2 9.19,8.63 2,9.24l5.46,4.73L5.82,21z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_arrow_back.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_fingerprint_line.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zm0,18c-4.41,0 -8,-3.59 -8,-8s3.59,-8 8,-8 8,3.59 8,8 -3.59,8 -8,8z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_menu.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M3,18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_wallet.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M21,18v1c0,1.1 -0.9,2 -2,2H5c-1.11,0 -2,-0.9 -2,-2V5c0,-1.1 0.89,-2 2,-2h14c1.1,0 2,0.9 2,2v1h-9c-1.11,0 -2,0.9 -2,2v8c0,1.1 0.89,2 2,2h9zm-9,-2h10V8H12v8zm4,-2.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_bell.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zm6,-6v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
        </vector>
        EOF

        # Generate default launcher icons
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#F16521" android:pathData="M0,0h108v108h-108z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_background" />
        </adaptive-icon>
        EOF

        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_background" />
        </adaptive-icon>
        EOF

        # Generate Layout Fallbacks if missing
        cat << 'EOF' > app/src/main/res/layout/nav_header_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="160dp"
            android:background="#F16521" android:orientation="vertical" android:padding="16dp" android:gravity="bottom">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RAMA77" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold"/>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/item_funds_menu.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:orientation="horizontal" android:padding="12dp">
            <TextView android:id="@+id/tvTitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF"/>
        </LinearLayout>
        EOF

        # Move Menu XMLs if present
        for f in bottom_nav_menu.xml drawer_nav_menu.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/menu/
        done
        
        # Move version catalog file
        [ -f libs.versions.toml ] && mv libs.versions.toml gradle/
        
        # Move Kotlin source files
        for f in *.kt; do
          [ -f "$f" ] && mv "$f" app/src/main/java/com/rama77/app/
        done
        
        # Move XML layout files
        for f in activity_*.xml fragment_*.xml item_*.xml nav_*.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/layout/
        done
        
        # Move ALL drawables (bg_*.xml, ic_*.xml) to res/drawable
        for f in bg_*.xml ic_*.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/drawable/
        done
        
        # Move other XML resources
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
        
        # Setup App Module build script
        [ -f build.gradle.kts ] && mv build.gradle.kts app/
        
        # Create Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: |
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
