name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: 1. Auto-Move Files & Generate All Secondary Resources
      run: |
        mkdir -p app/src/main/java/com/rama77/app/network/model \
                 app/src/main/java/com/rama77/app/network/sync \
                 app/src/main/java/com/rama77/app/repository \
                 app/src/main/java/com/rama77/app/viewmodel \
                 app/src/main/java/com/rama77/app/adapter \
                 app/src/main/java/com/rama77/app/model \
                 app/src/main/java/com/rama77/app/ui/login \
                 app/src/main/java/com/rama77/app/ui/register \
                 app/src/main/java/com/rama77/app/ui/home \
                 app/src/main/java/com/rama77/app/ui/gamecenter \
                 app/src/main/res/layout \
                 app/src/main/res/values \
                 app/src/main/res/color \
                 app/src/main/res/drawable \
                 app/src/main/res/menu \
                 app/src/main/res/xml \
                 app/src/main/res/mipmap-anydpi-v26 \
                 gradle/wrapper

        # Move source Kotlin files
        [ -f LoginActivity.kt ] && mv LoginActivity.kt app/src/main/java/com/rama77/app/ui/login/
        [ -f RegisterActivity.kt ] && mv RegisterActivity.kt app/src/main/java/com/rama77/app/ui/register/
        [ -f HomeFragment.kt ] && mv HomeFragment.kt app/src/main/java/com/rama77/app/ui/home/
        [ -f GameCenterActivity.kt ] && mv GameCenterActivity.kt app/src/main/java/com/rama77/app/ui/gamecenter/
        [ -f SubGameBetActivity.kt ] && mv SubGameBetActivity.kt app/src/main/java/com/rama77/app/ui/gamecenter/
        [ -f MarketAdapter.kt ] && mv MarketAdapter.kt app/src/main/java/com/rama77/app/adapter/
        [ -f GameOptionAdapter.kt ] && mv GameOptionAdapter.kt app/src/main/java/com/rama77/app/adapter/
        [ -f BetSummaryAdapter.kt ] && mv BetSummaryAdapter.kt app/src/main/java/com/rama77/app/adapter/
        [ -f NumberInputAdapter.kt ] && mv NumberInputAdapter.kt app/src/main/java/com/rama77/app/adapter/
        [ -f MarketItem.kt ] && mv MarketItem.kt app/src/main/java/com/rama77/app/model/
        [ -f GameOption.kt ] && mv GameOption.kt app/src/main/java/com/rama77/app/model/
        [ -f BetItem.kt ] && mv BetItem.kt app/src/main/java/com/rama77/app/model/
        [ -f ApiModels.kt ] && mv ApiModels.kt app/src/main/java/com/rama77/app/network/model/
        [ -f ApiService.kt ] && mv ApiService.kt app/src/main/java/com/rama77/app/network/
        [ -f RetrofitClient.kt ] && mv RetrofitClient.kt app/src/main/java/com/rama77/app/network/
        [ -f RamaRepository.kt ] && mv RamaRepository.kt app/src/main/java/com/rama77/app/repository/
        [ -f MarketViewModel.kt ] && mv MarketViewModel.kt app/src/main/java/com/rama77/app/viewmodel/
        [ -f WalletViewModel.kt ] && mv WalletViewModel.kt app/src/main/java/com/rama77/app/viewmodel/
        [ -f Matka777SyncManager.kt ] && mv Matka777SyncManager.kt app/src/main/java/com/rama77/app/network/sync/
        [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/rama77/app/

        # Clean corrupted fragment_support
        rm -f fragment_support.xml app/src/main/res/layout/fragment_support.xml

        # Move XML Layouts & Drawables
        for f in activity_*.xml fragment_*.xml item_*.xml nav_*.xml; do [ -f "$f" ] && mv "$f" app/src/main/res/layout/; done
        [ -f nav_header_main.xml ] && mv nav_header_main.xml app/src/main/res/layout/
        for f in bottom_nav_menu.xml drawer_nav_menu.xml; do [ -f "$f" ] && mv "$f" app/src/main/res/menu/; done
        for f in *.xml; do [ -f "$f" ] && [[ "$f" =~ ^(bg_\vert{}ic_\vert{}round_) ]] && mv "$f" app/src/main/res/drawable/; done
        
        [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/

        # Remove helperTextColor from activity_register.xml to avoid attribute error
        if [ -f app/src/main/res/layout/activity_register.xml ]; then
            sed -i '/helperTextColor/d' app/src/main/res/layout/activity_register.xml
        fi

        # Generate item_funds_menu.xml
        cat << 'EOF' > app/src/main/res/layout/item_funds_menu.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="horizontal"
            android:padding="16dp">
            <TextView
                android:id="@+id/tvFundsTitle"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Funds Item"
                android:textColor="#000000"
                android:textSize="16sp" />
        </LinearLayout>
        EOF

        # Generate selector_nav_color.xml
        cat << 'EOF' > app/src/main/res/color/selector_nav_color.xml
        <?xml version="1.0" encoding="utf-8"?>
        <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:color="#FF7A00" android:state_checked="true" />
            <item android:color="#6B7280" />
        </selector>
        EOF

        # Generate missing drawables
        cat << 'EOF' > app/src/main/res/drawable/bg_white_rounded_card.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#FFFFFF"/>
            <corners android:radius="12dp"/>
        </shape>
