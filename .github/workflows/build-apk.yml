name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Quick Build Setup & Compile
      run: |
        mkdir -p app/src/main/res/drawable app/src/main/res/values app/src/main/java/com/rama77/app
        
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        echo '<resources><style name="MpinBoxStyle" parent="Widget.AppCompat.EditText"/></resources>' > app/src/main/res/values/styles.xml
        
        VECTOR='<vector xmlns:android="http://schemas.android.com/apk/res/android" width="24dp" height="24dp" viewportWidth="24" viewportHeight="24"><path android:fillColor="#F16521" android:pathData="M12,2L2,22h20L12,2z"/></vector>'
        echo "$VECTOR" > app/src/main/res/drawable/ic_launcher_background.xml
        
        # Duplicate vector for common missing drawables automatically
        for name in bg_orange_gradient_button bg_button_orange bg_play_button ic_arrow_back ic_menu ic_wallet ic_bell ic_user ic_home ic_settings ic_share ic_log_out ic_dice_all ic_dice_1 ic_dice_2 ic_boxes; do
          echo "$VECTOR" > "app/src/main/res/drawable/${name}.xml"
        done

        # Move root files into correct project structure
        [ -f build.gradle.kts ] && mv build.gradle.kts app/
        for f in *.kt; do [ -f "$f" ] && mv "$f" app/src/main/java/com/rama77/app/; done
        for f in activity_*.xml fragment_*.xml item_*.xml nav_*.xml; do [ -f "$f" ] && mv "$f" app/src/main/res/layout/; done

        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
