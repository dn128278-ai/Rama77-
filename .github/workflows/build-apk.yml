name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 1. Create Directories & Setup Settings
      run: |
        mkdir -p app/src/main/java/com/rama77/app \
                 app/src/main/res/layout \
                 app/src/main/res/values \
                 app/src/main/res/drawable \
                 app/src/main/res/color \
                 app/src/main/res/menu \
                 app/src/main/res/mipmap-mdpi \
                 app/src/main/res/mipmap-hdpi \
                 app/src/main/res/mipmap-xhdpi \
                 app/src/main/res/mipmap-xxhdpi \
                 app/src/main/res/mipmap-xxxhdpi \
                 app/src/main/res/xml \
                 gradle/wrapper
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "RAMA77"
        include(":app")
        EOF

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: 2. Generate Missing Resources & Rules
      run: |
        [ -f strings.xml ] && sed -i "s/Don't/Don\\\'t/g" strings.xml

        cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content>
        </full-backup-content>
        EOF

        cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup>
            </cloud-backup>
        </data-extraction-rules>
        EOF

        cat << 'EOF' > fragment_support.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Support"
                android:textColor="#FFFFFF"
                android:textSize="18sp"/>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="MpinBoxStyle" parent="Widget.AppCompat.EditText">
                <item name="android:layout_width">48dp</item>
                <item name="android:layout_height">56dp</item>
                <item name="android:gravity">center</item>
                <item name="android:inputType">numberPassword</item>
                <item name="android:maxLength">1</item>
                <item name="android:textSize">20sp</item>
                <item name="android:textStyle">bold</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/color/selector_nav_color.xml
        <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_checked="true" android:color="#F16521" />
            <item android:color="#8E8E93" />
        </selector>
        EOF

        cat << 'EOF' > app/src/main/res/layout/item_funds_menu.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:orientation="horizontal" android:padding="12dp">
            <TextView android:id="@+id/tvTitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF"/>
        </LinearLayout>
        EOF

    - name: 3. Generate Drawables, Mipmaps & Mock Kotlin
      run: |
        D="app/src/main/res/drawable"
        V='<vector xmlns:android="http://schemas.android.com/apk/res/android" width="24dp" height="24dp" viewportWidth="24" viewportHeight="24"><path android:fillColor="#F16521" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/></vector>'
        S='<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#F16521"/><corners android:radius="8dp"/></shape>'

        for name in bg_game_center_scaffold bg_orange_gradient_button bg_button_orange bg_orange_circle bg_orange_circle_badge bg_white_rounded_card bg_translucent_circle bg_translucent_pill bg_session_container bg_session_tab_active bg_session_tab_inactive bg_logo_icon bg_wallet_pill bg_page_inactive bg_page_active_orange bg_badge_amount_green bg_category_tab_selected bg_orange_gradient_drawer bg_play_button bg_avatar_circle bg_play_button_disabled; do
          echo "$S" > "$D/${name}.xml"
        done

        IC_XML='<vector xmlns:android="http://schemas.android.com/apk/res/android" width="48dp" height="48dp" viewportWidth="24" viewportHeight="24"><path android:fillColor="#F16521" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/></vector>'
        for m in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          echo "$IC_XML" > "app/src/main/res/$m/ic_launcher.xml"
          echo "$IC_XML" > "app/src/main/res/$m/ic_launcher_round.xml"
        done

        for name in ic_dice_all ic_dice_1 ic_dice_2 ic_boxes ic_card_single ic_card_double ic_card_triple ic_gauge ic_brackets ic_users ic_layout_grid ic_call_orange ic_whatsapp_green ic_lock_key ic_starline_small ic_target ic_info_circle_orange ic_fingerprint_line ic_menu ic_wallet ic_bell ic_arrow_back ic_trash ic_play_button ic_play_arrow ic_user ic_clock_history ic_book_passbook ic_home ic_wallet_funds ic_support_headset ic_line_chart ic_help_circle ic_message_square ic_rupee_coin ic_file_text ic_settings ic_globe ic_moon ic_orange_gradient_drawer ic_avatar_circle ic_ico_circle_orange ic_share ic_log_out; do
          echo "$V" > "$D/${name}.xml"
        done

        KT="app/src/main/java/com/rama77/app"
        cat << 'EOF' > "$KT/MockExtensions.kt"
        package com.rama77.app
        import android.view.View
        import androidx.appcompat.app.AppCompatActivity
        import androidx.fragment.app.Fragment
        import androidx.fragment.app.FragmentActivity
        import androidx.viewpager2.adapter.FragmentStateAdapter

        val AppCompatActivity.charts: View? get() = null
        val AppCompatActivity.funds: View? get() = null
        val AppCompatActivity.history: View? get() = null
        val AppCompatActivity.mpin: View? get() = null
        val AppCompatActivity.passbook: View? get() = null
        val AppCompatActivity.rates: View? get() = null
        val AppCompatActivity.settings: View? get() = null
        val AppCompatActivity.support: View? get() = null

        open class ChartsActivity : AppCompatActivity()
        open class ChangeMpinActivity : AppCompatActivity()
        open class GameRatesActivity : AppCompatActivity()
        open class SettingsActivity : AppCompatActivity()
        open class HistoryFragment : Fragment()
        open class PassbookFragment : Fragment()
        open class FundsFragment : Fragment()
        open class SupportFragment : Fragment()
        open class SeriesTabAdapter(fa: FragmentActivity) : FragmentStateAdapter(fa) {
            override fun getItemCount(): Int = 0
            override fun createFragment(position: Int): Fragment = Fragment()
        }
        interface ApiService
        EOF

    - name: 4. Clean XMLs, Move Files & Build APK
      run: |
        for f in *.kt; do [ -f "$f" ] && mv "$f" app/src/main/java/com/rama77/app/; done
        
        for f in *.xml; do
          if [ -f "$f" ]; then
            sed -i 's/app:helperTextColor="[^"]*"//g; s/app:helperTextColor=[^[:space:]>]*//g' "$f"
            sed -i 's/&app:[^[:space:]>]*//g' "$f"
          fi
        done

        for f in activity_*.xml fragment_*.xml item_*.xml nav_*.xml; do [ -f "$f" ] && mv "$f" app/src/main/res/layout/; done
        for f in bottom_nav_menu.xml drawer_nav_menu.xml; do [ -f "$f" ] && mv "$f" app/src/main/res/menu/; done
        for f in bg_*.xml ic_*.xml; do [ -f "$f" ] && mv "$f" app/src/main/res/drawable/; done
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/

        rm -f build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.rama77.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.rama77.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
            buildFeatures {
                viewBinding = true
                dataBinding = true
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
            implementation("androidx.viewpager2:viewpager2:1.0.0")
            implementation("androidx.cardview:cardview:1.0.0")
            implementation("androidx.biometric:biometric:1.1.0")
            implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("com.squareup.retrofit2:retrofit:2.9.0")
            implementation("com.squareup.retrofit2:converter-gson:2.9.0")
            implementation("com.squareup.okhttp3:logging-interceptor:4.11.0")
        }
        EOF

        gradle wrapper --gradle-version 8.5
        gradle :app:assembleDebug --refresh-dependencies --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
