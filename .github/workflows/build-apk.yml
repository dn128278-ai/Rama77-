        cat << 'EOF' > app/src/main/res/drawable/ic_whatsapp_green.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#25D366" android:pathData="M12,2C6.48,2 2,6.48 2,12c0,1.82 0.49,3.53 1.35,5L2,22l5.13,-1.33C8.55,21.52 10.22,22 12,22c5.52,0 10,-4.48 10,-10S17.52,2 12,2z"/>
        </vector>
