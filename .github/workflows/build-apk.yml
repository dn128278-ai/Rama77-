name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Directory Structure & Inject Clean XMLs
      run: |
        # Create directories for app module and resource structure
        mkdir -p app/src/main/java/com/rama77/app app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/color app/src/main/res/menu app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml gradle
        
        # Create gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # Clean strings.xml
        if [ -f strings.xml ]; then
          sed -i "s/Don't/Don\\\'t/g" strings.xml
        fi

        # Overwrite fragment_support.xml with a clean, fully valid XML structure
        cat << 'EOF' > fragment_support.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp"
            android:background="#121212">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Support and Help"
                android:textColor="#FFFFFF"
                android:textSize="22sp"
                android:textStyle="bold" />

            <androidx.cardview.widget.CardView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="16dp"
                app:cardBackgroundColor="#1E1E24"
                app:cardCornerRadius="12dp"
                app:cardElevation="4dp">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:padding="16dp">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Contact Customer Support"
                        android:textColor="#FFFFFF"
                        android:textSize="16sp"
                        android:textStyle="bold" />

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="8dp"
                        android:text="Need help with bets or withdrawals? Chat with us."
                        android:textColor="#AAAAAA"
                        android:textSize="14sp" />

                </LinearLayout>
            </androidx.cardview.widget.CardView>
        </LinearLayout>
        EOF

        # Create dummy backup and extraction rules
        cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content></full-backup-content>
        EOF

        cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup />
        </data-extraction-rules>
        EOF

        # Styles & Attrs
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="MpinBoxStyle">
                <item name="android:layout_width">48dp</item>
                <item name="android:layout_height">56dp</item>
                <item name="android:gravity">center</item>
                <item name="android:inputType">numberPassword</item>
                <item name="android:maxLength">1</item>
                <item name="android:textSize">20sp</item>
                <item name="android:textStyle">bold</item>
            </style>
        </resources>
        EOF

        # Generate Drawables & Shapes
        cat << 'EOF' > app/src/main/res/drawable/bg_page_inactive.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#44FFFFFF"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_page_active_orange.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#F16521"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_badge_amount_green.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#2E7D32"/>
            <corners android:radius="8dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_orange_gradient_drawer.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:startColor="#F16521" android:endColor="#A83200" android:angle="90"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_avatar_circle.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#FFFFFF"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_play_button.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#F16521"/>
        </shape>
        EOF

        # Vector Icons Fallbacks
        cat << 'EOF' > app/src/main/res/drawable/ic_headset_support.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M12,1c-4.97,0 -9,4.03 -9,9v7c0,1.66 1.34,3 3,3h3v-8H6v-2c0,-3.31 2.69,-6 6,-6s6,2.69 6,6v2h-3v8h3c1.66,0 3,-1.34 3,-3v-7c0,-4.97 -4.03,-9 -9,-9z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_chevron_right.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#8E8E93" android:pathData="M10,6L8.59,7.41 13.17,12l-4.58,4.59L10,18l6,-6z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_trash.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#D32F2F" android:pathData="M6,19c0,1.1 0.9,2 2,2h8c1.1,0 2,-0.9 2,-2V7H6v12zM19,4h-3.5l-1,-1h-5l-1,1H5v2h14V4z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_target.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M12,2C6.49,2 2,6.49 2,12s4.49,10 10,10 10,-4.49 10,-10S17.51,2 12,2zm0,18c-4.41,0 -8,-3.59 -8,-8s3.59,-8 8,-8 8,3.59 8,8 -3.59,8 -8,8zm0,-14c-3.31,0 -6,2.69 -6,6s2.69,6 6,6 6,-2.69 6,-6 -2.69,-6 -6,-6zm0,10c-2.21,0 -4,-1.79 -4,-4s1.79,-4 4,-4 4,1.79 4,4 -1.79,4 -4,4z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_info_circle_orange.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zm1,15h-2v-6h2v6zm0,-8h-2V7h2v2z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_play_arrow.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M8,5v14l11,-7z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_user.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#F16521" android:pathData="M12,12c2.21,0 4,-1.79 4,-4s-1.79,-4 -4,-4 -4,1.79 -4,4 1.79,4 4,4zm0,2c-2.67,0 -8,1.34 -8,4v2h16v-2c0,-2.66 -5.33,-4 -8,-4z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_clock_history.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M13,3c-4.97,0 -9,4.03 -9,9H1l3.89,3.89 0.07,0.14L9,12H6c0,-3.87 3.13,-7 7,-7s7,3.13 7,7 -3.13,7 -7,7c-1.93,0 -3.68,-0.79 -4.94,-2.06l-1.42,1.42C8.27,19.99 10.51,21 13,21c4.97,0 9,-4.03 9,-9s-4.03,-9 -9,-9zm-1,5v5l4.25,2.52 0.77,-1.28 -3.52,-2.09V8z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_book_passbook.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M18,2H6c-1.1,0 -2,0.9 -2,2v16c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V4c0,-1.1 -0.9,-2 -2,-2zM6,4h5v8l-2.5,-1.5L6,12V4z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_home.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_wallet_funds.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M21,18v1c0,1.1 -0.9,2 -2,2H5c-1.11,0 -2,-0.9 -2,-2V5c0,-1.1 0.89,-2 2,-2h14c1.1,0 2,0.9 2,2v1h-9c-1.11,0 -2,0.9 -2,2v8c0,1.1 0.89,2 2,2h9zm-9,-2h10V8H12v8zm4,-2.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5z"/>
        </vector>
        EOF

        # Launcher icons
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#F16521" android:pathData="M0,0h108v108h-108z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_background" />
        </adaptive-icon>
        EOF

        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_background" />
        </adaptive-icon>
        EOF

        # Move files cleanly
        [ -f libs.versions.toml ] && mv libs.versions.toml gradle/
        
        for f in *.kt; do
          [ -f "$f" ] && mv "$f" app/src/main/java/com/rama77/app/
        done
        
        for f in activity_*.xml fragment_*.xml item_*.xml nav_*.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/layout/
        done

        for f in bottom_nav_menu.xml drawer_nav_menu.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/menu/
        done
        
        for f in bg_*.xml ic_*.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/drawable/
        done
        
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
        
        [ -f build.gradle.kts ] && mv build.gradle.kts app/
        
        cat << 'EOF' > build.gradle.kts
        plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: |
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
